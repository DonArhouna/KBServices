version: '3.8'

services:
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    restart: always
    env_file:
      - ../.env
    ports:
      - "3001:3001"
    # Explicitly override depends_on (empty) so the merged compose
    # config doesn't keep a dependency on `postgres` from other files
    depends_on: []
    volumes:
      - ../ImagesSite:/app/ImagesSite
    networks:
      - kbnet
