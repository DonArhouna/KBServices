  
services:
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    restart: always
    env_file:
      - ../.env
    ports:
      - "3001:3001"
    # Explicitly override depends_on (empty) so the merged compose
    # config doesn't keep a dependency on `postgres` from other files
    depends_on: []
    volumes:
      - ../ImagesSite:/app/ImagesSite
    networks:
      - kbnet
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3001/api/health/tables || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  kbnet:
    external: true
    name: kbnet
