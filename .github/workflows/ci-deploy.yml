name: CI Build & Deploy (dev)

on:
  push:
    branches:
      - dev

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint || true

      - name: Run tests
        # There are no tests defined in package.json by default; run build instead
        run: npm run build

  deploy:
    name: Deploy to VPS
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH key
        uses: webfactory/ssh-agent@v0.8.1
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          # set StrictHostKeyChecking to no only if you trust the host; else add host to known_hosts
          script: |
            set -euo pipefail
            echo "Deploying to ${{ secrets.VPS_HOST }} as ${{ secrets.VPS_USER }}"
            cd ~/KBServices/KBS || exit 1
            git fetch origin
            git checkout dev
            git pull origin dev
            chmod +x deploy/remote-deploy.sh
            # run remote deploy script (attaches existing postgres container if provided)
            ./deploy/remote-deploy.sh dev --use-existing-db ${POSTGRES_CONTAINER:-postgres_db}
